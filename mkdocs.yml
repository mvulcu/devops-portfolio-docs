site_name: 🚀 Maria Vulcu | DevOps Portfolio
site_url: https://portfolio-app-prod-4f3dfbvo.azurewebsites.net/
site_description: Cloud-native DevOps portfolio with live monitoring, CI/CD, and Infrastructure as Code
site_author: Maria Vulcu
repo_url: https://github.com/mvulcu/devops-portfolio
repo_name: mvulcu/devops-portfolio

theme:
  name: material
  language: en
  logo: images/logo.png  
  favicon: images/logo.png  
  
  features:
   
    - navigation.instant         
    - navigation.tracking        
    - navigation.tabs            
    - navigation.sections        
    - navigation.expand          
    - navigation.path            
    - navigation.top             
    
   
    - content.code.copy          
    - content.code.annotate      
    
   
    - search.suggest             
    - search.highlight           
    - search.share               
    
    
    - toc.follow                 
    - toc.integrate              

  palette:
    
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Переключить на темную тему
    
    
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-night
        name: Переключить на светлую тему

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github

plugins:
  - search  
  


markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - tables
  
  # Python Markdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvulcu
      name: GitHub Profile
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/mariavulcu
      name: LinkedIn Profile

# Additional styles (optional)
extra_css:
  - stylesheets/extra.css

# Navigation
nav:
  - 🏠 Home: index.md
  - 📚 Documentation:
    - ☁️ Azure Deployment: deployment.md
    - 📊 Monitoring: monitoring.md
  
# Copyrights
copyright: |
  &copy; 2024 Maria Vulcu | Built with Material for MkDocs