site_name: DevOps Engineering Hub | Maria Vulcu
site_url: https://docs.mariavulcu.dev/
site_description: Technical documentation center for cloud-native projects, DevOps practices, and infrastructure automation
site_author: Maria Vulcu
repo_url: https://github.com/mvulcu
repo_name: mvulcu

theme:
  name: material
  language: en
  logo: images/logo.png  # Раскомментируйте когда добавите логотип
  # favicon: images/favicon.ico  # Раскомментируйте когда добавите иконку
  
  features:
    # Навигация
    - navigation.instant         # мгновенная навигация без перезагрузки
    - navigation.tracking        # обновление URL при прокрутке
    - navigation.tabs            # верхние табы
    - navigation.sections        # разделы в боковом меню
    - navigation.expand          # автораскрытие секций
    - navigation.path            # хлебные крошки
    - navigation.top             # кнопка "наверх"
    
    # Содержимое
    - content.code.copy          # кнопка копирования кода
    - content.code.annotate      # аннотации в коде
    
    # Поиск
    - search.suggest             # автозаполнение поиска
    - search.highlight           # подсветка найденных слов
    - search.share               # поделиться результатами поиска
    
    # Оглавление
    - toc.follow                 # следование за прокруткой
    - toc.integrate              # интеграция в контент

  palette:
    # Светлая тема
    - scheme: default
      primary: blue grey
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Переключить на темную тему
    
    # Темная тема
    - scheme: slate
      primary: grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Переключить на светлую тему

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github

plugins:
  - search  # Только базовый поиск, без дополнительных плагинов
  
  # Социальные карточки ОТКЛЮЧЕНЫ (требуют cairo)
  # - social

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - tables
  
  # Python Markdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvulcu
      name: GitHub Profile
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/mariavulcu
      name: LinkedIn Profile

# Дополнительные стили (опционально)
extra_css:
  - stylesheets/extra.css

# Навигация
nav:
  - 🏠 Home: index.md
  - 💼 Projects:
    - 📊 DevOps Portfolio:
      - Overview: portfolio/index.md
      - Azure Deployment: portfolio/deployment.md
      - Monitoring Strategy: portfolio/monitoring.md
    - 🎭 KulturHub:
      - Overview: kulturHub/index.md
      - Architecture: kulturHub/architecture.md
      - Infrastructure: kulturHub/infrastructure.md
      - CI/CD Pipeline: kulturHub/cicd.md
      - Security: kulturHub/security.md
      - Monitoring: kulturHub/monitoring.md
      - Microservices: kulturHub/microservices.md
      - Cost Optimization: kulturHub/optimization.md
      - Learning Outcomes: kulturHub/learning.md
  - 📬 Contact: contact.md
  
# Авторские права
