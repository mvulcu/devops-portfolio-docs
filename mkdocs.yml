site_name: DevOps Engineering Hub | Maria Vulcu
site_url: https://mvulcu.github.io/devops-portfolio-docs/
site_description: Technical documentation center for cloud-native projects, DevOps practices, and infrastructure automation
site_author: Maria Vulcu
repo_url: https://github.com/mvulcu
repo_name: mvulcu

theme:
  name: material
  language: en

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top

    # Code blocks
    - content.code.copy
    - content.code.annotate

    # Search
    - search.suggest
    - search.highlight
    - search.share

    # Table of contents
    - toc.follow

  palette:
    # Light mode: clean slate + indigo
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Dark mode: deep slate + cyan (Cloudflare / Stripe style)
    - scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvulcu
      name: GitHub Profile
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/mariavulcu
      name: LinkedIn Profile
    - icon: fontawesome/solid/globe
      link: https://grepme.dev
      name: grepme.dev Live Hub

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - "Portfolio (GCP Cloud Run)":
    - "System Overview": portfolio/index.md
    - "Azure Era (Legacy)": portfolio/deployment.md
    - "GCP Migration (Production)": portfolio/migration.md
    - "Observability Strategy": portfolio/monitoring.md
  - "KulturHub (Azure PaaS)":
    - "System Overview": kulturHub/index.md
    - "Architecture & Bicep IaC": kulturHub/architecture.md
    - "Infrastructure & Networking": kulturHub/infrastructure.md
    - "CI/CD & Delivery Pipelines": kulturHub/cicd.md
    - "Security & Secret Management": kulturHub/security.md
    - "Observability & InfluxDB": kulturHub/monitoring.md
    - "Microservices & MongoDB": kulturHub/microservices.md
    - "Cost Engineering & Constraints": kulturHub/optimization.md
    - "Engineering Retrospective": kulturHub/learning.md

